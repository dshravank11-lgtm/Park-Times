<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Times — Park News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-spinner"></div>
    </div>
    <div class="container">

        <div class="top-bar">
            <span id="current-date"></span>
            <span class="top-bar-edition">Park Edition</span>
            <button class="admin-toggle-btn" id="adminBtn" onclick="toggleAdminPanel()">Editor Sign In</button>
        </div>

        <header class="masthead">
            <div class="masthead-emblem">
                <img src="image.png" alt="Park Times" class="masthead-image">
            </div>
            <h1 class="masthead-title">Park Times</h1>
            <p class="masthead-tagline">All the News That&rsquo;s From The Park</p>
        </header>

        <nav>
            <hr>
            <ul>
                <li><a href="#" class="nav-link active" onclick="filterCategory('All', this)">All</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('News', this)">News</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('Football', this)">Football</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('Events', this)">Events</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('Opinion', this)">Opinion</a></li>
            </ul>
            <hr class="thick">
        </nav>

        <div id="adminPanel" class="admin-panel hidden">
            <div class="admin-content">
                <h3>Publish New Article</h3>
                <form id="publishForm" onsubmit="handlePublish(event)">
                    <div class="form-group">
                        <label>Admin Password</label>
                        <input type="password" id="adminPassword" required placeholder="Enter editor password">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="articleCategory">
                            <option value="News">News</option>
                            <option value="Football">Football</option>
                            <option value="Events">Events</option>
                            <option value="Opinion">Opinion</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Headline</label>
                        <input type="text" id="articleTitle" required placeholder="Headline...">
                    </div>
                    <div class="form-group">
                        <label>Image (Optional)</label>
                        <input type="text" id="articleImage" placeholder="image1.png or https://example.com/photo.jpg">
                    </div>
                    <div class="form-group">
                        <label>Summary / Body Text</label>
                        <textarea id="articleSummary" rows="4" required placeholder="Write the story here..."></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Publish Story</button>
                        <button type="button" class="btn-secondary" onclick="toggleAdminPanel()">Cancel</button>
                    </div>
                    <p id="formStatus" class="form-status"></p>
                </form>
            </div>
        </div>

        <main>
            <div id="newsGrid" class="grid-main"></div>
        </main>

        <footer>
            <p>&copy; <span id="year"></span> Park Times &mdash; 67</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
