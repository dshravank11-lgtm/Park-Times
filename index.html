<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Park Times — Park News</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-spinner"></div>
    </div>
    <div class="container">
        <div class="top-bar">
            <span id="current-date"></span>
            <div class="top-bar-actions">
                <button class="admin-signout-btn hidden" id="signOutBtn" onclick="handleSignOut()">Sign Out</button>
                <button class="admin-toggle-btn" id="adminBtn" onclick="handleAdminButtonClick()">Editor Sign In</button>
            </div>
        </div>

        <header>
            <img src="image.png" alt="Park Times" class="masthead-image">
        </header>

        <nav>
            <hr>
            <ul>
                <li><a href="#" class="nav-link active" onclick="filterCategory('All', this)">All</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('News', this)">News</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('Football', this)">Football</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('Events', this)">Events</a></li>
                <li><a href="#" class="nav-link" onclick="filterCategory('Opinion', this)">Opinion</a></li>
            </ul>
            <hr class="thick">
        </nav>

        <div id="adminPanel" class="admin-panel hidden">
            <div class="admin-content">

                <div id="loginView">
                    <h3>Editor Sign In</h3>
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="loginPassword" required placeholder="Enter editor password" autocomplete="current-password">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Sign In</button>
                            <button type="button" class="btn-secondary" onclick="closeAdminPanel()">Cancel</button>
                        </div>
                        <p id="loginStatus" class="form-status"></p>
                    </form>
                </div>

                <div id="composeView" class="hidden">
                    <h3>Publish New Article</h3>
                    <form id="publishForm" onsubmit="handlePublish(event)">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="articleCategory">
                                <option value="News">News</option>
                                <option value="Football">Football</option>
                                <option value="Events">Events</option>
                                <option value="Opinion">Opinion</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Headline</label>
                            <input type="text" id="articleTitle" required placeholder="Headline...">
                        </div>
                        <div class="form-group">
                            <label>Cover Image (Optional)</label>
                            <input type="text" id="articleImage" placeholder="image1.png or https://example.com/photo.jpg">
                        </div>
                        <div class="form-group">
                            <label>Summary</label>
                            <textarea id="articleSummary" rows="3" required placeholder="Short teaser shown on the front page..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Article Body (Optional)</label>
                            <div class="editor-toolbar">
                                <button type="button" class="editor-btn" data-cmd="bold" title="Bold"><b>B</b></button>
                                <button type="button" class="editor-btn" data-cmd="italic" title="Italic"><i>I</i></button>
                                <button type="button" class="editor-btn" data-cmd="h2" title="Subheading">H2</button>
                                <button type="button" class="editor-btn" data-cmd="quote" title="Pull quote">&ldquo;&rdquo;</button>
                                <button type="button" class="editor-btn" id="insertImageBtn" title="Insert image here">+ Image</button>
                            </div>
                            <div id="articleContent" class="editor-content" contenteditable="true" data-placeholder="Write the full story here. Place your cursor anywhere and use + Image to drop a picture at that exact point."></div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Publish Story</button>
                            <button type="button" class="btn-secondary" onclick="closeAdminPanel()">Cancel</button>
                        </div>
                        <p id="formStatus" class="form-status"></p>
                    </form>
                </div>

            </div>
        </div>

        <main>
            <div id="heroSlot" class="hero-slot"></div>
            <div id="newsGrid" class="grid-main"></div>
        </main>

        <footer>
            <p>&copy; <span id="year"></span> Park Times &mdash; 67</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
